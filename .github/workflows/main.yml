steps:
  # 1. 깃허브 저장소의 파일들을 서버로 불러옵니다.
  - name: 저장소 코드 불러오기
    uses: actions/checkout@v4

  # 2. 파이썬 환경을 설치합니다.
  - name: 파이썬 설정하기
    uses: actions/setup-python@v5
    with:
      python-version: '3.10'

  # 3. 데이터 변환에 필요한 파이썬 라이브러리들을 설치합니다.
  - name: 필수 라이브러리 설치
    run: |
      python -m pip install --upgrade pip
      pip install pandas openpyxl pdfplumber

  # 4. 우리가 만든 파이썬 변환기를 실행합니다.
  - name: 파이썬 스크립트 실행 (JSON 변환)
    run: python converter.py

  # 5. 새롭게 만들어진 data_for_web.js 파일을 깃허브에 다시 저장(Commit & Push)합니다.
  - name: 결과물을 깃허브에 자동 반영하기
    run: |
      git config --local user.email "action@github.com"
      git config --local user.name "GitHub Action Bot"
      git add data_for_web.js
      git commit -m "봇이 데이터를 성공적으로 업데이트했습니다 🤖" || echo "변경된 데이터가 없습니다."
      git push
